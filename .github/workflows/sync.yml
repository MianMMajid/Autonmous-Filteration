name: Scheduled sync

# Opt-in deployment: see docs/DEPLOYMENT.md. Raw customer data is never cached.
on:
  schedule:
    - cron: "17 13,17,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteledger-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.SYNC_ENABLED == 'true'
    # A trusted persistent Linux host with atomic hard-link support.
    runs-on: [self-hosted, linux, pulley-sync]
    timeout-minutes: 15
    env:
      DATA_DIR: ${{ vars.SYNC_DATA_DIR }}
      BACKUP_DIR: ${{ vars.SYNC_BACKUP_DIR }}
      SYNC_ENABLED: ${{ vars.SYNC_ENABLED }}
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/deployment-preflight.mjs
        env:
          SYNC_HEARTBEAT_URL: ${{ secrets.SYNC_HEARTBEAT_URL }}

      - name: Sync
        env:
          SITELEDGER_USERNAME: ${{ secrets.SITELEDGER_USERNAME }}
          SITELEDGER_PASSWORD: ${{ secrets.SITELEDGER_PASSWORD }}
          PULLEY_API_KEY: ${{ secrets.PULLEY_API_KEY }}
          LOG_LEVEL: warn
        run: pnpm sync

      - name: Verify and back up the publication
        run: |
          node src/cli.ts status --max-age-hours 24 --max-source-age-hours 24
          node src/cli.ts backup "$BACKUP_DIR"

      - name: Resolve verified publication
        id: published
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { latestRunId, readRunRecord } from './src/run/outputs.ts';
          import { verifyOutputDirectory } from './src/run/integrity.ts';
          const runId = await latestRunId(process.env.DATA_DIR);
          if (!runId) throw new Error('No publication');
          await readRunRecord(process.env.DATA_DIR, runId);
          const path = resolve(process.env.DATA_DIR, 'out', runId);
          await verifyOutputDirectory(path, runId);
          await appendFile(process.env.GITHUB_OUTPUT, `run_id=${runId}\npath=${path}\n`);
          JS

      - name: Publish verified outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siteledger-sync-${{ steps.published.outputs.run_id }}
          path: ${{ steps.published.outputs.path }}/
          retention-days: 30
          if-no-files-found: error

      - name: Signal verified publication to independent monitor
        env:
          SYNC_HEARTBEAT_URL: ${{ secrets.SYNC_HEARTBEAT_URL }}
        run: node scripts/heartbeat.mjs
