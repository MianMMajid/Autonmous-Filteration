name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Preflight (no credentials in CI)
        run: pnpm preflight --skip-env

      - name: Lint and format
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Dependency advisories (production dependencies)
        run: pnpm audit --prod --audit-level=high
